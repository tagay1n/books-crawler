        request_timeout_seconds: 60
        metadata_root: ~/.monocorpus/misc/upstream_metadata
        flag_name: needs_full_download
      milli_kitaphana_download:
        url_http_kitap_tatar_ru_dl: http://kitap.tatar.ru/dl
