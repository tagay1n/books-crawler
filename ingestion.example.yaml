      raw_key:
        env: MILLI_KITAPHANA_AES_RAW_KEY
      default_iv:
        env: MILLI_KITAPHANA_AES_DEFAULT_IV
      salt:
        env: MILLI_KITAPHANA_AES_SALT
    priv_key:
      env: MILLI_KITAPHANA_PRIV_KEY
    sig_prefix:
      env: MILLI_KITAPHANA_SIG_PREFIX
    database_url:
