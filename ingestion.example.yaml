# Local pilot defaults. Copy to ingestion.yaml and select it with --config.
# Relative paths are resolved against this YAML file, not the current directory.
artifacts_root: __artifacts/ingestion
sources:
  litres:
    archive_url: https://www.litres.ru/new/?art_types=text_book&languages=tt&only_litres_subscription_arts=true
    sid: <SET ME>
    pdf:
      jpeg_quality: 85
      max_width: null
      dpi: 200
      lossless_first_pages: 1
      browser_headless: true
      browser_challenge_wait_seconds: 30
    discover:
      search_queries: ["татарская литература", "татарча"]
      max_pages_per_query: 20
      min_score: 3
      search_request_retries: 3
      browser_headless: true
    # Publishing only: retain existing destination credentials here.
    # yandex.oauth_token: <SET ME>
    # s3: {endpoint_url: ..., aws_access_key_id: ..., aws_secret_access_key: ..., bucket: ...}
  # Original full-issue PDFs of the publisher-declared Tatar/Russian series.
  tuganzhir:
    archive_url: https://tuganzhir.org/archive/
  # Contemporary DUM RT Tatar newspaper and almanac; linked original PDFs only.
  dumrt:
    archive_url: https://dumrt.ru/media/din-va-magishet/
  # Native full-issue PDFs explicitly labelled Tatar; article files excluded.
  ftatarstan:
    archive_url: https://ftatarstan.ru/index.php/ftat/ru/issue/archive
  # Explicit publisher Tatar item labels; individual PDF files only.
  sarhaan:
    archive_url: https://sarhaan.com/a/tatar-%d8%aa%d8%aa%d8%a7%d8%b1%d9%8a/
  # Mixed subject catalog; only individually reviewed Tatar textbook PDFs are acquired.
  obuchalka:
    archive_url: https://obuchalka.org/knigi-po-tatarskomu-yaziku/
  # Journal issue traversal; only article PDFs explicitly labelled Tatar are acquired.
  echovek:
    archive_url: https://www.echovek.ru/ru/publications
  # Linked original PDFs of the bilingual Nizgar magazine; one archive observation.
  nizgar:
    archive_url: https://nizgar.ru/zhurnal-nizhegorodskie-tatary-nizhgar-tatarlary/
  # Publisher book PDFs; explicit Tatar target-language claims or hash-pinned reviews.
  yazuchy:
    archive_url: https://sptatar.com/yazuchy-n-shriyaty/
  # Tatar-labelled dictionaries only; Crimean Tatar and general multilingual titles excluded.
  turuz:
    archive_url: https://turuz.com/index/pitik/category/2
  # Issue metadata and linked originals only; covers are not journal documents.
  beznenmiras:
    archive_url: https://beznenmiras.ru/categories/widget/list/svezii-vypusk
  # Native publication catalog; explicit language claims or reviewed file hashes.
  tataroved:
    archive_url: https://tataroved.ru/publication/
  # Academic archive: topic search plus item-language or hash-pinned file review.
  kfu_dspace:
    archive_url: https://dspace.kpfu.ru/xmlui/discover
  # All historical repository collections; explicit Tatar item labels required.
  kfu_repository:
    archive_url: https://repo.kpfu.ru/jspui/community-list
  # Azad Halyk newspaper: explicit Tatar item-language labels required.
  kfu_azad_halyk:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/27528
  # Vakyt newspaper: exact series search; explicit Tatar item labels required.
  kfu_vakyt:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/86/simple-search
  # Shura journal: explicit Tatar language labels required.
  kfu_shura:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/25046
  # All hosted documents; document language is not inferred from the catalog locale.
  tatargalyame:
    archive_url: https://tatargalyame.kpfu.ru/catalogue
  # Il newspaper issues: explicit Tatar language labels required.
  kfu_il:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/28060
  kfu_books:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/27574
  kfu_manuscripts:
    archive_url: https://repo.kpfu.ru/jspui/handle/net/18503
  internet_archive:
    archive_url: https://archive.org
  isxaki:
    archive_url: https://isxaki.com/ijat/
  magarif:
    archive_url: https://magarif-uku.ru/documents
  # Tatar textbook ZIPs linked by the publisher; retained originals plus derived PDFs.
  magarif_vakyt:
    archive_url: https://magarif-vakyt.ru/online2
  tatarica:
    archive_url: https://tatarica.org/tat/razdely/tatarika-kitaphanse
  darul_kutub:
    archive_url: https://darul-kutub.com/search
  kazanutlary:
    archive_url: https://kazanutlary.ru/j-archive
  tatkniga:
    archive_url: https://tatkniga.ru/catalog/biblioteka/
  # Pass --session-file PATH to discover/download/run; status needs no session.
  miras:
    archive_url: https://miras.info/projects/mirasxane/books/
  # Separate periodical series manifest; uses the same Miras browser session export.
  miras_periodicals:
    archive_url: https://miras.info/projects/mirasxane/periodicals/
  # Original documents with source size/SHA-1 validation; cover images are skipped.
  commons:
    archive_url: https://commons.wikimedia.org/wiki/Category:Tatar-language_books
  common_crawl:
    archive_url: https://huggingface.co/datasets/HuggingFaceFW/finepdfs
    result_dir: ~/.common-crawl/result
    cache_dir: ~/.common-crawl/warcs
    yandex:
      disk:
        oauth_token: <SET ME>
        target_dir: /НейроТатарлар/kitaplar/common_crawl
  milli_kitaphana:
    aes:
      raw_key: <SET ME>
      default_iv: <SET ME>
      salt: <SET ME>
    priv_key: <SET ME>
    sig_prefix: <SET ME>
    database_url: <SET ME>
    yandex:
      disk:
        oauth_token: <SET ME>
        target_dir: <SET ME>
    archive_url: https://kitap.tatar.ru/tt/ssearch/ecollection/
limits:
  max_pages: 25
  max_items: 25
  max_download_bytes: 1073741824
  max_file_bytes: 104857600
  disk_reserve_bytes: 536870912
  soft_deadline_seconds: 900
network:
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  pacing_seconds: 1
  retry_attempts: 3
