name: Windows Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run non-destructive CLI command
        run: |
          python milli_kitaphana/cli.py split --parts 1
