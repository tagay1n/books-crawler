aes:
  # AES key used to encrypt the private RSA key
  raw_key: !!binary "dkNhVCRwUjI="
  default_iv: !!binary "AAECAwQFBgcICQoLDA0ODw=="
  # salt used in AES encryption
  salt: !!binary "ZGVmZ2hpams=" 

# server's RSA private key in PEM format, encrypted with AES, represented in base64.
priv_key: !!binary ""

# prefix added in front of all signatures
sig_prefix: !!binary "UkIAAQ=="


yandex:
  disk:
    oauth_token: <SET ME>
    target_dir: <SET ME>
  cloud:
    aws_access_key_id: <SET ME>
    aws_secret_access_key: <SET ME>
    bucket:
      document: <SET ME>
      metadata: <SET ME>